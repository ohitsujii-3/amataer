<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>おひつ爺式／強み資質の順位テスト</title>
<style>
:root{--bg:#0f172a;--bg2:#1e1b4b;--card:#1e293b;--line:#334155;--txt:#e2e8f0;--sub:#94a3b8;--accent:#6366f1;--paper:#faf9f7;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;background:var(--paper);color:#1e293b;line-height:1.7;}
.wrap{max-width:600px;margin:0 auto;padding:0 20px;}
.dark{background:linear-gradient(160deg,#0f172a,#1e1b4b);min-height:100vh;color:var(--txt);}
.pad{padding:48px 0;}
h1{font-size:26px;font-weight:700;line-height:1.4;margin:12px 0 16px;color:#fff;}
.ey{font-size:12px;letter-spacing:3px;color:#a5b4fc;margin:0;}
.lead{color:#cbd5e1;margin:0 0 20px;}
.note{background:rgba(30,41,59,.6);border:1px solid var(--line);border-radius:16px;padding:18px;font-size:14px;color:#cbd5e1;margin:0 0 24px;}
.note b{color:#fff;}
button{font-family:inherit;cursor:pointer;border:none;}
.btn{width:100%;border-radius:12px;background:var(--accent);color:#fff;font-weight:600;padding:15px;font-size:16px;transition:.15s;}
.btn:hover{background:#818cf8;}
.btn.g{background:#10b981;}.btn.g:hover{background:#34d399;}
.link{width:100%;background:none;color:var(--sub);font-size:14px;padding:8px;margin-top:10px;}
.pwbox{display:flex;flex-direction:column;gap:12px;max-width:280px;}
.pwbox input{padding:14px;border-radius:12px;border:1px solid var(--line);background:#0f172a;color:#fff;font-size:18px;text-align:center;letter-spacing:6px;}
.err{color:#f87171;font-size:13px;min-height:18px;}
/* quiz */
.qwrap{background:var(--paper);min-height:100vh;}
.sticky{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid #e7e5e4;}
.bar{height:6px;border-radius:3px;background:#e7e5e4;overflow:hidden;}
.bar>i{display:block;height:100%;background:var(--accent);transition:width .2s;}
.meta{display:flex;justify-content:space-between;font-size:12px;color:#78716c;margin-bottom:8px;}
.remind{font-size:12px;color:#6366f1;background:#eef2ff;border:1px solid #c7d2fe;border-radius:10px;padding:8px 12px;margin:12px 0 4px;text-align:center;}
.ends{display:flex;justify-content:space-between;font-size:11px;color:#a8a29e;padding:0 4px;margin:10px 0;}
.q{background:#fff;border:1px solid #e7e5e4;border-radius:16px;padding:18px;box-shadow:0 1px 2px rgba(0,0,0,.04);margin-bottom:14px;}
.qt{color:#292524;margin:0 0 14px;}.qt .n{color:#d6d3d1;font-size:14px;margin-right:8px;}
.opts{display:flex;gap:6px;}
.opt{flex:1;border-radius:10px;padding:10px 2px;font-size:12px;font-weight:500;background:#f5f5f4;color:#78716c;transition:.12s;}
.opt.on{background:var(--accent);color:#fff;box-shadow:0 2px 6px rgba(99,102,241,.4);}
.nav{display:flex;gap:12px;margin-top:24px;}
.nav .back{border-radius:12px;border:1px solid #d6d3d1;background:none;color:#57534e;padding:14px 20px;}
.nav .next{flex:1;border-radius:12px;background:var(--accent);color:#fff;font-weight:600;font-size:16px;}
.nav .next.g{background:#10b981;}
/* results */
.dcard{background:rgba(30,41,59,.6);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px;}
.drow{display:flex;justify-content:space-between;align-items:center;}
.dname{font-weight:600;color:#fff;}
.dsc{font-size:14px;color:#cbd5e1;}
.dsub{font-size:12px;color:var(--sub);margin:4px 0 10px;}
.dbar{height:8px;border-radius:4px;background:#334155;overflow:hidden;}
.dbar>i{display:block;height:100%;border-radius:4px;}
.ftoggle{font-size:11px;color:#64748b;margin-top:8px;background:none;padding:4px 0;}
.facet{margin-top:10px;}
.frow{display:flex;justify-content:space-between;font-size:12px;color:#cbd5e1;margin-bottom:3px;}
.fbar{height:6px;border-radius:3px;background:#334155;overflow:hidden;}
.fbar>i{display:block;height:100%;border-radius:3px;opacity:.85;}
textarea{width:100%;height:220px;border-radius:12px;background:#0f172a;border:1px solid var(--line);color:#e2e8f0;font-size:12px;padding:12px;font-family:ui-monospace,monospace;resize:vertical;}
.hide{display:none;}

.srank{width:26px;text-align:center;font-weight:700;color:#a5b4fc;flex:0 0 auto;}
.srank.dim{color:#64748b;}
.sbadge{font-size:10px;padding:2px 7px;border-radius:6px;white-space:nowrap;}
details{margin:4px 0 8px;}
summary{color:#cbd5e1;font-size:14px;cursor:pointer;padding:8px 0;list-style:none;}
summary::-webkit-details-marker{display:none;}
</style>
</head>
<body>
<div id="app"></div>
<script>
const ITEMS = [{"id": "e1-0", "dim": "e1", "dom": "EX", "t": "やり遂げたことを一つずつ積み上げていく感覚が好きだ。"}, {"id": "e1-1", "dim": "e1", "dom": "EX", "t": "「今日も何かを成し遂げた」と思えないと落ち着かない。"}, {"id": "e1-2", "dim": "e1", "dom": "EX", "t": "やるべきことが多くても、次々と片付けていくのが得意だ。"}, {"id": "e1-3", "dim": "e1", "dom": "EX", "t": "忙しく生産的に過ごしているときが一番充実する。"}, {"id": "e1-4", "dim": "e1", "dom": "EX", "t": "目標を達成するまで手を止めたくない。"}, {"id": "e1-5", "dim": "e1", "dom": "EX", "t": "成果を出すためにコツコツ努力を続けられる。"}, {"id": "e2-0", "dim": "e2", "dom": "EX", "t": "たくさんの要素を並べ替えて最適な形を見つけるのが得意だ。"}, {"id": "e2-1", "dim": "e2", "dom": "EX", "t": "複数の物事を同時に効率よく回すのが好きだ。"}, {"id": "e2-2", "dim": "e2", "dom": "EX", "t": "状況が変わっても、その場で段取りを組み直せる。"}, {"id": "e2-3", "dim": "e2", "dom": "EX", "t": "人や資源をうまく配置して物事を進めるのが得意だ。"}, {"id": "e2-4", "dim": "e2", "dom": "EX", "t": "「もっと良いやり方はないか」と手順を工夫するのが好きだ。"}, {"id": "e2-5", "dim": "e2", "dom": "EX", "t": "複雑な予定でも全体を見渡して調整できる。"}, {"id": "e3-0", "dim": "e3", "dom": "EX", "t": "引き受けたことは何があってもやり遂げる。"}, {"id": "e3-1", "dim": "e3", "dom": "EX", "t": "約束を守れないと自分を許せない気持ちになる。"}, {"id": "e3-2", "dim": "e3", "dom": "EX", "t": "人から頼まれたことに強い責任を感じる。"}, {"id": "e3-3", "dim": "e3", "dom": "EX", "t": "「あの人に任せれば大丈夫」と思われることが多い。"}, {"id": "e3-4", "dim": "e3", "dom": "EX", "t": "中途半端に終わらせることに強い抵抗がある。"}, {"id": "e3-5", "dim": "e3", "dom": "EX", "t": "自分の言葉に責任を持つことを大切にしている。"}, {"id": "e4-0", "dim": "e4", "dom": "EX", "t": "目標を一つに絞ると力を発揮できる。"}, {"id": "e4-1", "dim": "e4", "dom": "EX", "t": "「これは今やるべきことか」と常に自問する。"}, {"id": "e4-2", "dim": "e4", "dom": "EX", "t": "寄り道や脱線を避け、優先順位に沿って進める。"}, {"id": "e4-3", "dim": "e4", "dom": "EX", "t": "ゴールが明確だと迷わず突き進める。"}, {"id": "e4-4", "dim": "e4", "dom": "EX", "t": "気が散る要素を切り捨てて集中できる。"}, {"id": "e4-5", "dim": "e4", "dom": "EX", "t": "進むべき方向がはっきりしていると力が出る。"}, {"id": "e5-0", "dim": "e5", "dom": "EX", "t": "決める前に、起こりうるリスクをよく見極める。"}, {"id": "e5-1", "dim": "e5", "dom": "EX", "t": "軽々しく約束や決断をしないほうだ。"}, {"id": "e5-2", "dim": "e5", "dom": "EX", "t": "物事の落とし穴やリスクに人より気づきやすい。"}, {"id": "e5-3", "dim": "e5", "dom": "EX", "t": "慎重に進めることで失敗を減らせると考える。"}, {"id": "e5-4", "dim": "e5", "dom": "EX", "t": "大事な選択は時間をかけて吟味する。"}, {"id": "e5-5", "dim": "e5", "dom": "EX", "t": "「本当に大丈夫か」と確かめてから前に進む。"}, {"id": "e6-0", "dim": "e6", "dom": "EX", "t": "問題や不具合を見つけて直すことにやりがいを感じる。"}, {"id": "e6-1", "dim": "e6", "dom": "EX", "t": "壊れたものや停滞した状況を立て直すのが得意だ。"}, {"id": "e6-2", "dim": "e6", "dom": "EX", "t": "何がうまくいっていないかを分析するのが好きだ。"}, {"id": "e6-3", "dim": "e6", "dom": "EX", "t": "困難な状況ほど「解決してやろう」と燃える。"}, {"id": "e6-4", "dim": "e6", "dom": "EX", "t": "原因を突き止めて修復することに喜びを感じる。"}, {"id": "e6-5", "dim": "e6", "dom": "EX", "t": "「どうすれば直るか」を考えるのが好きだ。"}, {"id": "e7-0", "dim": "e7", "dom": "EX", "t": "自分の中に揺るがない価値観がある。"}, {"id": "e7-1", "dim": "e7", "dom": "EX", "t": "損得より「正しいと思えるか」で行動を選ぶ。"}, {"id": "e7-2", "dim": "e7", "dom": "EX", "t": "自分の信じることに沿って生きていたい。"}, {"id": "e7-3", "dim": "e7", "dom": "EX", "t": "仕事や活動に意味や使命を感じられることが大切だ。"}, {"id": "e7-4", "dim": "e7", "dom": "EX", "t": "価値観に反することはしたくない。"}, {"id": "e7-5", "dim": "e7", "dom": "EX", "t": "何を大事にするかが自分の行動の軸になっている。"}, {"id": "e8-0", "dim": "e8", "dom": "EX", "t": "誰に対しても同じルールで公平に接したい。"}, {"id": "e8-1", "dim": "e8", "dom": "EX", "t": "えこひいきや例外扱いに強い違和感を覚える。"}, {"id": "e8-2", "dim": "e8", "dom": "EX", "t": "明確なルールがあると物事を進めやすい。"}, {"id": "e8-3", "dim": "e8", "dom": "EX", "t": "みんなが同じ土俵で扱われることを重視する。"}, {"id": "e8-4", "dim": "e8", "dom": "EX", "t": "手順や基準を一貫させることが大切だと思う。"}, {"id": "e8-5", "dim": "e8", "dom": "EX", "t": "公平さを保つことに気を配る。"}, {"id": "i1-0", "dim": "i1", "dom": "IN", "t": "とりあえず始めてみて、動きながら考えるほうだ。"}, {"id": "i1-1", "dim": "i1", "dom": "IN", "t": "議論より「まずやってみよう」と行動に移したくなる。"}, {"id": "i1-2", "dim": "i1", "dom": "IN", "t": "アイデアを実行に移すきっかけを作るのが得意だ。"}, {"id": "i1-3", "dim": "i1", "dom": "IN", "t": "停滞している場を動かす役になることが多い。"}, {"id": "i1-4", "dim": "i1", "dom": "IN", "t": "待つより先に動き出したい。"}, {"id": "i1-5", "dim": "i1", "dom": "IN", "t": "考え込むより、まず一歩を踏み出したくなる。"}, {"id": "i2-0", "dim": "i2", "dom": "IN", "t": "必要なときは場の主導権を握って決断を促せる。"}, {"id": "i2-1" function order(n,seed){let s=seed>>>0;const r=()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};const a=[...Array(n).keys()];for(let i=n-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const DISP=order(TOTAL,731).map(i=>ITEMS[i]);

let state={screen:"pw",answers:{},page:0,pw:"",err:"",done:false};
try{const s=localStorage.getItem(KEY);if(s){const o=JSON.parse(s);state.answers=o.answers||{};state.page=o.page||0;state.done=o.done||false;}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify({answers:state.answers,page:state.page,done:state.done}));}catch(e){}}
const answered=()=>Object.keys(state.answers).length;
const app=document.getElementById("app");
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");

function ranked(){
  const bd={};
  for(const it of ITEMS){const a=state.answers[it.id];if(!a)continue;(bd[it.dim]=bd[it.dim]||[]).push(a);}
  const sca=m=>Math.round((m-1)/4*100);
  const rows=Object.keys(DIMS).map(dk=>{const arr=bd[dk]||[];const mean=arr.length?arr.reduce((x,y)=>x+y,0)/arr.length:0;return{dim:dk,dom:DIMS[dk].dom,name:DIMS[dk].name,desc:DIMS[dk].desc,score:arr.length?sca(mean):0,n:arr.length};});
  rows.sort((a,b)=>b.score-a.score);
  return rows;
}
function summary(){
  const rows=ranked();
  const full=rows.map((r,i)=>(i+1)+". "+r.name+"（"+DOMAINS[r.dom].label+"）"+r.score).join("\n");
  const da={};for(const d in DOMAINS){const rs=rows.filter(r=>r.dom===d);da[d]=rs.length?Math.round(rs.reduce((x,y)=>x+y.score,0)/rs.length):0;}
  const dl=Object.keys(DOMAINS).map(d=>DOMAINS[d].label+" "+da[d]).join(" / ");
  return "おひつ爺式／強み資質の順位テスト 結果  回答 "+answered()+"/"+TOTAL+"問\n【全30資質ランキング（1位=最も前に出やすい / 下位=言語化しにくい苦手意識のヒント）】\n"+full+"\n\n【領域バランス(平均)】\n"+dl;
}

function render(){if(state.screen==="pw")return renderPw();if(state.screen==="intro")return renderIntro();if(state.screen==="results")return renderResults();renderQuiz();}
function renderPw(){
  app.innerHTML=`<div class="dark"><div class="wrap pad"><p class="ey">PROTECTED</p><h1>パスワードを入力</h1><p class="lead">このテストは限定公開です。</p><div class="pwbox"><input id="pw" type="password" inputmode="numeric" placeholder="****" value="${esc(state.pw)}"><div class="err">${state.err}</div><button class="btn" id="go">開く</button></div></div></div>`;
  const inp=document.getElementById("pw");
  const go=()=>{if(inp.value==="4321"){state.screen="intro";state.err="";render();}else{state.err="パスワードが違います。";state.pw="";render();document.getElementById("pw").focus();}};
  document.getElementById("go").onclick=go;inp.onkeydown=e=>{if(e.key==="Enter")go();};inp.focus();
}
function renderIntro(){
  const resume=answered()>0 && !state.done;
  app.innerHTML=`<div class="dark"><div class="wrap pad">
  <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:14px"><div><p class="ey">おひつ爺式セルフテスト</p><h1>強み資質の順位</h1></div><img src="${ICON}" alt="" style="width:88px;height:88px;flex:0 0 auto;margin-top:2px"></div>
  <p class="lead">4つの領域（実行力・影響力・人間関係構築力・戦略的思考力）にまたがる30の資質を、各6問・計180問で見ていきます。所要は30〜45分ほど。途中で閉じても、同じ端末・ブラウザなら回答は保存されます。</p>
  <div class="note">結果は<b>「自分の中での強みの順位」</b>として出ます。他人との比較ではなく、あなたの中でどの資質が前に出やすいかの<b>傾向の可視化</b>です。<b>過去、半年以内に感じたまま</b>、直感でお答えください。<br><br>回答はこの端末（ブラウザ）内だけに保存され、他の人や他の端末には共有されません。<b>一度結果を見ると、次回は自動的に最初からになります。</b></div>
  ${resume?`<p style="color:#a5b4fc;font-size:14px">この端末に、途中までの回答（${answered()}/${TOTAL}問）が残っています。</p>
  <button class="btn" id="start">続きから（${answered()}/${TOTAL}問）</button>`:`<button class="btn" id="start">はじめる</button>`}
  </div></div>`;
  document.getElementById("start").onclick=()=>{if(!resume){state.answers={};state.page=0;state.done=false;save();}state.screen="quiz";render();window.scrollTo(0,0);};
}
function renderQuiz(){
  const start=state.page*PER, items=DISP.slice(start,start+PER), last=state.page===PAGES-1, pct=Math.round(answered()/TOTAL*100);
  let qs="";
  items.forEach((it,idx)=>{const cur=state.answers[it.id];qs+=`<div class="q"><p class="qt"><span class="n">${start+idx+1}.</span>${esc(it.t)}</p><div class="opts">`;LIKERT.forEach(([v,s])=>{qs+=`<button class="opt${cur===v?" on":""}" data-id="${it.id}" data-v="${v}">${s}</button>`;});qs+=`</div></div>`;});
  app.innerHTML=`<div class="qwrap">
  <div class="sticky"><div class="wrap" style="padding-top:12px;padding-bottom:12px">
    <div class="meta"><span>ページ ${state.page+1} / ${PAGES}</span><span>${answered()} / ${TOTAL} 問（${pct}%）</span></div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="remind">「過去、半年以内に感じたまま」で回答してください</div>
  </div></div>
  <div class="wrap" style="padding-top:16px;padding-bottom:32px">
    <div class="ends"><span>← あてはまらない</span><span>あてはまる →</span></div>
    ${qs}
    <div class="nav"><button class="back" id="back">戻る</button>${last?`<button class="next g" id="fin">結果を見る</button>`:`<button class="next" id="next">次へ</button>`}</div>
  </div></div>`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{state.answers[b.dataset.id]=+b.dataset.v;save();b.parentElement.querySelectorAll(".opt").forEach(x=>x.classList.remove("on"));b.classList.add("on");const pct=Math.round(answered()/TOTAL*100);app.querySelector(".bar>i").style.width=pct+"%";app.querySelector(".meta span:last-child").textContent=answered()+" / "+TOTAL+" 問（"+pct+"%）";});
  document.getElementById("back").onclick=()=>{if(state.page===0){state.screen="intro";}else{state.page--;save();}render();window.scrollTo(0,0);};
  const nx=document.getElementById("next");if(nx)nx.onclick=()=>{state.page++;save();render();window.scrollTo(0,0);};
  const fn=document.getElementById("fin");if(fn)fn.onclick=()=>{state.done=true;save();state.screen="results";render();window.scrollTo(0,0);};
}
function srow(r,rank,hi){const c=DOMAINS[r.dom].color;return `<div class="dcard" style="padding:14px"><div style="display:flex;align-items:center;gap:12px"><span class="srank${hi?"":" dim"}">${rank}</span><div style="flex:1;min-width:0"><div class="drow"><span class="dname" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${r.name}</span><span class="dsc">${r.score}</span></div><div style="display:flex;align-items:center;gap:8px;margin-top:4px"><span class="sbadge" style="background:${c}33;color:${c}">${DOMAINS[r.dom].label}</span><span style="font-size:11px;color:#94a3b8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${r.desc}</span></div><div class="dbar" style="margin-top:8px"><i style="width:${r.score}%;background:${c}"></i></div></div></div></div>`;}
function renderResults(){
  const rows=ranked(),top=rows.slice(0,8),rest=rows.slice(8);
  app.innerHTML=`<div class="dark"><div class="wrap pad">
  <p class="ey">RESULT</p><h1 style="font-size:22px">あなたの強みプロフィール</h1>
  <p class="dsub" style="margin-bottom:20px">回答 ${answered()}/${TOTAL}問・スコアは自分の中での相対的な強さ（0〜100）</p>
  <p style="color:#a5b4fc;font-size:14px;font-weight:600;margin:0 0 12px">上位資質 トップ8</p>
  ${top.map((r,i)=>srow(r,i+1,true)).join("")}
  <details><summary>9位以下もすべて見る（全30資質）</summary>${rest.map((r,i)=>srow(r,i+9,false)).join("")}</details>
  <div class="note" style="margin-top:20px">下の枠のテキストをコピーして返信して下さい。『傾向』『強みの活かし方』『無意識な苦手意識』を可視化します。<br><br>
  <textarea id="ta" readonly>${esc(summary())}</textarea>
  <button class="btn" id="copy" style="margin-top:12px">結果をコピー</button><a class="btn" href="https://forms.gle/Bkiiiygs3px3Pn9e9" target="_blank" rel="noopener" style="display:block;text-align:center;text-decoration:none;margin-top:10px;background:none;border:1px solid #6366f1;color:#a5b4fc">回答フォームを開いて送信</a></div>
  <div class="nav"><button class="back" id="reans" style="flex:1;text-align:center">回答に戻る</button></div>
  </div></div>`;
  document.getElementById("copy").onclick=async()=>{const ta=document.getElementById("ta");ta.select();let ok=false;try{await navigator.clipboard.writeText(ta.value);ok=true;}catch(e){try{ok=document.execCommand("copy");}catch(e2){}}document.getElementById("copy").textContent=ok?"コピーしました ✓":"枠を長押しでコピーしてください";};
  document.getElementById("reans").onclick=()=>{state.screen="quiz";render();window.scrollTo(0,0);};
}
render();
</script>
</body>
